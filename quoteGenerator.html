<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famous Quote Generator</title>
    <link rel="stylesheet" href="quoteGenerator.css">
</head>

<body>
    <div class="container">
        <h2 class="heading">Quote Generator</h2>
        <div class="quote-container">
            <p id="famous-quotes">For last year's words belong to last year's language / And next year's words await another voice</p>
            <div class="person"> —T.S. Eliot</div>
            <span class="year-of-quote">1942</span>

            <div>
                <button class="quote-generator-btn">New Quote</button>
            </div>
        </div>
    </div>
    <script src="quoteGenerator.js"></script>
</body>

</html>
